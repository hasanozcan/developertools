name: Frontend Quality

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "frontend/**"
      - "extension/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "extension/**"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify package signatures and advisories
        run: npm audit signatures && npm run audit:security

      - name: Run quality checks
        run: npm run check

      - name: Package browser extensions
        run: npm run build:extension

      - name: Verify production build
        env:
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_CURRENCY: USD
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_VALUE: "1"
          NEXT_PUBLIC_GOOGLE_ADS_SEND_TO: AW-TEST/contact
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser, route, conversion, and accessibility checks
        run: npm run test:e2e
