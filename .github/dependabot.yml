version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-security-and-tooling:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-packages:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
