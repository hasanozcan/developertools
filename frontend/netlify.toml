[build]
  # Frontend klasöründe build komutunu çalıştır
  command = "npm run build"
  publish = "out"

[build.environment]
  # Node.js versiyonu
  NODE_VERSION = "18"

# Redirect kuralları - API isteklerini backend'e yönlendir
[[redirects]]
  from = "/api/*"
  to = "${BACKEND_API_URL}/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
