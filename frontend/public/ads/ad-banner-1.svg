<svg width="1200" height="628" viewBox="0 0 1200 628" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bgGrad1)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.03">
    <pattern id="grid1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="628" fill="url(#grid1)"/>
  </g>
  
  <!-- Decorative Circles -->
  <circle cx="50" cy="50" r="300" fill="url(#logoGrad)" opacity="0.05"/>
  <circle cx="1150" cy="580" r="350" fill="url(#logoGrad)" opacity="0.05"/>
  
  <!-- Left Side Content -->
  <g transform="translate(80, 120)">
    <!-- Logo Icon -->
    <g transform="translate(0, 0)">
      <path d="M50 0L100 28.87V86.6L50 115.47L0 86.6V28.87L50 0Z" fill="url(#logoGrad)"/>
      <path d="M50 10L90 33.09V79.28L50 102.37L10 79.28V33.09L50 10Z" fill="rgba(255,255,255,0.1)"/>
      <path d="M32 46L18 57.5L32 69" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M68 46L82 57.5L68 69" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="57.5" r="7" fill="url(#btnGrad)"/>
    </g>
    
    <!-- Brand Name -->
    <text x="120" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="white">DevsTools</text>
  </g>
  
  <!-- Main Headline -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="white">Free Developer Tools</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="url(#logoGrad)">That Just Work</text>
  
  <!-- Subheadline -->
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">30+ tools: JSON, Base64, UUID, Hash, Regex &amp; more</text>
  
  <!-- CTA Button -->
  <g transform="translate(80, 490)">
    <rect width="280" height="60" rx="30" fill="url(#btnGrad)"/>
    <text x="140" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="white">Try Now - It's Free!</text>
  </g>
  
  <!-- Right Side - Tool Cards -->
  <g transform="translate(700, 100)">
    <!-- Card 1 - JSON -->
    <g transform="translate(0, 0)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#0EA5E9" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#0EA5E9">{}</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">JSON Formatter</text>
    </g>
    
    <!-- Card 2 - Base64 -->
    <g transform="translate(220, 0)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#8B5CF6" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#8B5CF6">B64</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Base64 Encoder</text>
    </g>
    
    <!-- Card 3 - UUID -->
    <g transform="translate(0, 140)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#10B981" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10B981">UUID</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">UUID Generator</text>
    </g>
    
    <!-- Card 4 - Password -->
    <g transform="translate(220, 140)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#EC4899" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#EC4899">🔐</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Password Gen</text>
    </g>
    
    <!-- Card 5 - QR Code -->
    <g transform="translate(0, 280)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#06B6D4" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#06B6D4">▣</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">QR Code</text>
    </g>
    
    <!-- Card 6 - Hash -->
    <g transform="translate(220, 280)">
      <rect width="200" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#f59e0b" opacity="0.2"/>
      <text x="45" y="52" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#f59e0b">#</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Hash Generator</text>
    </g>
  </g>
  
  <!-- Bottom Badge -->
  <g transform="translate(80, 570)">
    <text font-family="system-ui, sans-serif" font-size="16" fill="#64748b">✓ No signup required  •  ✓ 100% Free  •  ✓ Works in browser</text>
  </g>
  
  <!-- URL -->
  <text x="1120" y="590" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="url(#logoGrad)">devstools.app</text>
</svg>
