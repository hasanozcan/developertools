  <text x="600" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#94a3b8">MD5, SHA-1, SHA-256, SHA-512</text>
  
  <!-- Hash Examples -->
  <g transform="translate(200, 370)">
