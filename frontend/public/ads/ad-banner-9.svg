  </defs>
  <rect width="1200" height="628" fill="url(#bg9)"/>
  
  <!-- Hash Focus -->
  <text x="600" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#ef4444">CRYPTO TOOLS</text>
