<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F1D5C"/>
      <stop offset="50%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="628" fill="url(#bg13)"/>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="#A855F7" opacity="0.1"/>
  <circle cx="100" cy="500" r="150" fill="#EC4899" opacity="0.1"/>
  
  <!-- Markdown preview icon -->
  <g transform="translate(800, 140)">
    <rect x="0" y="0" width="300" height="340" rx="15" fill="#1F2937" stroke="#A855F7" stroke-width="3"/>
    <!-- Editor side -->
    <rect x="15" y="15" width="130" height="310" rx="8" fill="#0F172A"/>
    <text x="30" y="50" font-family="monospace" font-size="14" fill="#A855F7"># Title</text>
    <text x="30" y="80" font-family="monospace" font-size="12" fill="#94A3B8">Some text</text>
    <text x="30" y="110" font-family="monospace" font-size="14" fill="#A855F7">## Sub</text>
    <text x="30" y="140" font-family="monospace" font-size="12" fill="#94A3B8">- list 1</text>
    <text x="30" y="165" font-family="monospace" font-size="12" fill="#94A3B8">- list 2</text>
    <text x="30" y="195" font-family="monospace" font-size="12" fill="#EC4899">**bold**</text>
    <text x="30" y="225" font-family="monospace" font-size="12" fill="#06B6D4">*italic*</text>
    <text x="30" y="255" font-family="monospace" font-size="12" fill="#22C55E">`code`</text>
    <!-- Preview side -->
    <rect x="155" y="15" width="130" height="310" rx="8" fill="#1E293B"/>
    <text x="170" y="55" font-family="Arial" font-size="22" font-weight="bold" fill="white">Title</text>
    <text x="170" y="85" font-family="Arial" font-size="14" fill="#94A3B8">Some text</text>
    <text x="170" y="115" font-family="Arial" font-size="18" font-weight="bold" fill="white">Sub</text>
    <circle cx="177" cy="138" r="4" fill="#A855F7"/>
    <text x="190" y="143" font-family="Arial" font-size="14" fill="#94A3B8">list 1</text>
    <circle cx="177" cy="163" r="4" fill="#A855F7"/>
    <text x="190" y="168" font-family="Arial" font-size="14" fill="#94A3B8">list 2</text>
    <text x="170" y="198" font-family="Arial" font-size="14" font-weight="bold" fill="white">bold</text>
    <text x="170" y="228" font-family="Arial" font-size="14" font-style="italic" fill="#94A3B8">italic</text>
    <rect x="168" y="240" width="45" height="22" rx="4" fill="#374151"/>
    <text x="175" y="256" font-family="monospace" font-size="12" fill="#22C55E">code</text>
  </g>
  
  <!-- Main text -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">Markdown</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#accent13)">Preview</text>
  
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8">Write Markdown, see HTML live</text>
  <text x="80" y="415" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8">Real-time preview editor</text>
  
  <!-- CTA Button -->
  <rect x="80" y="460" width="320" height="60" rx="30" fill="url(#accent13)"/>
  <text x="145" y="500" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Try Editor Now →</text>
  
  <!-- Logo -->
  <g transform="translate(50, 50)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="none" stroke="url(#accent13)" stroke-width="2"/>
    <text x="20" y="48" font-family="monospace" font-size="20" font-weight="bold" fill="white">&lt;/&gt;</text>
  </g>
  <text x="140" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">DevsTools</text>
  
  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="24" fill="#64748B" text-anchor="middle">devstools.dev</text>
</svg>