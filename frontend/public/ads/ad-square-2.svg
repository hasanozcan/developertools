      <rect x="560" y="0" width="250" height="70" rx="12" fill="#EC4899" opacity="0.2" stroke="#EC4899" stroke-width="2"/>
      <text x="685" y="45" font-family="Arial" font-size="24" font-weight="bold" fill="#EC4899" text-anchor="middle">Hash Gen</text>
      
      <rect x="0" y="100" width="250" height="70" rx="12" fill="#22C55E" opacity="0.2" stroke="#22C55E" stroke-width="2"/>
      <text x="125" y="145" font-family="Arial" font-size="24" font-weight="bold" fill="#22C55E" text-anchor="middle">Base64</text>
      
      <rect x="280" y="100" width="250" height="70" rx="12" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
      <text x="405" y="145" font-family="Arial" font-size="24" font-weight="bold" fill="#F59E0B" text-anchor="middle">Regex Test</text>
      
