  <circle cx="100" cy="528" r="300" fill="url(#accentGrad)" opacity="0.05"/>
  
  <!-- Code Background Pattern -->
  <g opacity="0.03" transform="translate(600, 50)">
    <text font-family="monospace" font-size="14" fill="white">{"name": "developer", "tools": true}</text>
    <text y="25" font-family="monospace" font-size="14" fill="white">const uuid = generateUUID();</text>
    <text y="50" font-family="monospace" font-size="14" fill="white">base64.encode(data);</text>
    <text y="75" font-family="monospace" font-size="14" fill="white">hash.sha256(input);</text>
