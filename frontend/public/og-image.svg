    </pattern>
    <rect width="1200" height="630" fill="url(#specGrid)"/>
  </g>

  <!-- 1px Structural Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#27272A" stroke-width="1"/>

  <!-- Corner + Registration Marks -->
  <g stroke="#52525B" stroke-width="1.5">
    <path d="M28 36H44M36 28V44"/>
    <path d="M1156 36H1172M1164 28V44"/>
    <path d="M28 594H44M36 586V602"/>
    <path d="M1156 594H1172M1164 586V602"/>
  </g>

  <!-- Top Spec Header -->
  <rect x="64" y="64" width="1072" height="44" fill="#111114" stroke="#27272A" stroke-width="1"/>
  <rect x="80" y="82" width="8" height="8" rx="1" fill="#10B981"/>
  <text x="100" y="91" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">
