  <g transform="translate(80, 444)" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600">
    <rect x="0" y="0" width="128" height="34" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="64" y="22" text-anchor="middle" fill="#E4E4E7">JSON // YAML</text>

    <rect x="140" y="0" width="144" height="34" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="212" y="22" text-anchor="middle" fill="#E4E4E7">CRYPTO // HASH</text>

    <rect x="296" y="0" width="160" height="34" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="376" y="22" text-anchor="middle" fill="#E4E4E7">ENCODERS // JWT</text>

    <rect x="468" y="0" width="150" height="34" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="543" y="22" text-anchor="middle" fill="#E4E4E7">REGEX // DIFF</text>

    <rect x="630" y="0" width="170" height="34" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="715" y="22" text-anchor="middle" fill="#E4E4E7">FORMATTERS // SQL</text>
