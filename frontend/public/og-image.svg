    <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <path d="M9 9.5L15.5 16L9 22.5L7.3 20.8L12.1 16L7.3 11.2Z" fill="#FAFAFA"/>
    <rect x="17" y="19.75" width="7.75" height="2.75" rx="0.4" fill="#10B981"/>
  </g>

  <!-- Title & Description -->
  <text x="80" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#FAFAFA">
